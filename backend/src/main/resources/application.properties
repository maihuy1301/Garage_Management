spring.application.name=garage-backend
server.port=${SERVER_PORT:8080}

# Database Configuration (SQL Server Docker / Local: default localhost:1433)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GarageManagementSystem;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YourPassword123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS & WebSocket Allowed Origins (supports * or comma-separated patterns for LAN/Docker development)
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}
