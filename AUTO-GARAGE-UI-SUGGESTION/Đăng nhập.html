<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface-gray min-h-screen flex items-center justify-center font-body-md text-on-surface">
<div class="w-full max-w-md p-margin-mobile md:p-0">
<!-- Logo Area -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-primary-container">AutoCare <span class="font-headline-md text-headline-md text-industrial-slate block mt-1">Multi-Branch</span></h1>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/30 p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded focus:ring-primary-container focus:border-primary-container font-body-sm text-body-sm text-on-surface h-10" id="email" name="email" placeholder="admin@autocare.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2 border border-outline-variant rounded focus:ring-primary-container focus:border-primary-container font-body-sm text-body-sm text-on-surface h-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline hover:text-on-surface-variant transition-colors" id="togglePassword">visibility_off</span>
</div>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary-container focus:ring-primary-container border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors duration-200" type="submit">
                        Đăng nhập
                    </button>
</div>
</form>
<!-- Support Text -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-outline">
                    Need help? <a class="font-label-md text-label-md text-primary-container hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
</div>
<script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });
    </script>
</body></html>
